[package]
name = "rustymusicsheets"
version = "0.2.2"
authors = ["Ripley Eldridge"]
homepage = "https://github.com/ripleyeldridge"
edition = "2021"
rust-version = "1.86"
description = "A native Linux sheet-music library and performance reader"
license = "MIT"
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
walkdir = "2"
url = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["x11", "wayland", "accesskit"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
zbus = "=4.4.0"

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.15.4", default-features = false }
windows-sys = { version = "=0.59.0", features = ["Win32_System_Power"] }
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.14.1"
jni = "=0.21.1"
log = "0.4"

[package.metadata.android]
package = "org.ripleyeldridge.rustymusicsheets"
apk_name = "RustyMusicSheets"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "RustyMusicSheets"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
exported = true
launch_mode = "standard"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "image/png"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "image/jpeg"

[profile.release]
opt-level = 2

[lints.clippy]
dbg_macro = "deny"
