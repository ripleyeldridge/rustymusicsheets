[package]
name = "rustymusicsheets"
version = "0.2.1"
authors = ["RustyMusicSheets contributors"]
edition = "2021"
rust-version = "1.86"
description = "A native Linux sheet-music library and performance reader"
license = "MIT"

[dependencies]
anyhow = "1"
async-io = "2"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
futures-lite = "2"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
walkdir = "2"
zbus = "=4.4.0"

[profile.release]
opt-level = 2

[lints.clippy]
dbg_macro = "deny"
